<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tu Tiên Idle — Con Đường Trường Sinh</title>
<meta name="description" content="Game tu tiên idle: thiền tu, đột phá cảnh giới, độ kiếp phi thăng. Chơi trên web, desktop và mobile.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./assets/icon-512.png">
<link rel="apple-touch-icon" href="./assets/icon-512.png">
<link rel="stylesheet" href="./styles/ui.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1c;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #fade { position: fixed; inset: 0; z-index: 50;
    background: #0a0e1c url('./assets/splash.jpg') center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 700ms ease; pointer-events: all; }
  #fade .loader-veil { position: absolute; inset: 0; background: rgba(6,8,18,0.62); }
  #fade .loader { position: relative; color: #ffd76a; font: 600 17px/1.6 Georgia, serif; text-align: center; text-shadow: 0 2px 12px #000; }
  #boot-error { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 60; color: #fff; font: 600 15px/1.45 system-ui, sans-serif; background: #a0263d;
    padding: 18px 20px; border-radius: 12px; width: min(88vw, 560px); max-height: 72vh; overflow: auto; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="fade"><div class="loader-veil"></div><div class="loader">☯<br>Đang dẫn khí nhập thể…</div></div>
<div id="boot-error"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
