<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tu Tiên Idle — Con Đường Trường Sinh</title>
<meta name="description" content="Game tu tiên idle: thiền tu, đột phá cảnh giới, độ kiếp phi thăng. Chơi trên web, desktop và mobile.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./assets/icon-512.png">
<link rel="apple-touch-icon" href="./assets/icon-512.png">
<link rel="stylesheet" href="./styles/ui.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1c;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0a0e1c; }
  #bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 4s ease; }
  #bg img.on { opacity: 1; }
  .cloud-drift { position: absolute; top: -12%; bottom: -12%; left: 0; right: 0;
    pointer-events: none; background-repeat: repeat-x; }
  #vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2,3,10,0.5) 100%); }
  #fade { position: fixed; inset: 0; z-index: 50;
    background: #060a18 url('./assets/splash.jpg') center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 700ms ease; pointer-events: all; overflow: hidden; }
  #fade .loader-veil { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(6,8,18,0.3), rgba(4,6,14,0.9)); }
  #fade .loader { position: relative; text-align: center; padding: 20px; max-width: 92vw; }
  .loader-logo { font-size: 66px; animation: spin 7s linear infinite;
    filter: drop-shadow(0 0 20px rgba(212,175,55,0.85)); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-title { font: 700 46px Georgia, "Times New Roman", serif; letter-spacing: 12px;
    color: #ffe9a8; text-shadow: 0 0 34px rgba(212,175,55,0.9), 0 3px 8px #000; margin: 8px 0 2px; }
  .loader-sub { color: #c9a94f; font: 400 14px Georgia, serif; letter-spacing: 7px; margin-bottom: 28px; }
  .loader-barwrap { width: min(72vw, 340px); height: 10px; margin: 0 auto; border-radius: 6px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.6); overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.7); }
  .loader-bar { height: 100%; width: 0%; border-radius: 5px;
    background: linear-gradient(90deg, #8a6d1f, #d4af37, #ffe9a8);
    box-shadow: 0 0 12px rgba(212,175,55,0.9); transition: width 400ms ease; }
  .loader-tip { margin-top: 16px; color: #d8d2b8; font-size: 13px; min-height: 40px; text-shadow: 0 1px 4px #000; }
  .loader-tip b { color: #ffd76a; }
  .loader-status { margin-top: 4px; color: #8a8570; font-size: 12px; }
  .loader-ver { position: absolute; bottom: 14px; right: 16px; color: #6a6552; font-size: 11px; }
  #boot-error { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 60; color: #fff; font: 600 15px/1.45 system-ui, sans-serif; background: #a0263d;
    padding: 18px 20px; border-radius: 12px; width: min(88vw, 560px); max-height: 72vh; overflow: auto; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<div id="bg">
  <img id="bg-day" src="./assets/bg-pham-day.jpg" alt="">
  <img id="bg-sunset" src="./assets/bg-pham-sunset.jpg" alt="">
  <img id="bg-night" src="./assets/bg-pham-night.jpg" alt="">
  <div id="cloud-a" class="cloud-drift"></div>
  <div id="cloud-b" class="cloud-drift"></div>
</div>
<div id="app"></div>
<div id="vignette"></div>
<div id="fade">
  <div class="loader-veil"></div>
  <div class="loader">
    <div class="loader-logo">☯</div>
    <div class="loader-title">TU TIÊN</div>
    <div class="loader-sub">IDLE · TRƯỜNG SINH LỘ</div>
    <div class="loader-barwrap"><div class="loader-bar" id="loadbar"></div></div>
    <div class="loader-tip" id="loadtip"></div>
    <div class="loader-status" id="loadstatus">Đang khởi động…</div>
  </div>
  <div class="loader-ver">v0.3</div>
</div>
<div id="boot-error"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
